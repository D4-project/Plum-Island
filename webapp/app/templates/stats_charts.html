<div class="stats-charts">
{% for field, label in series %}
{% set maximum = [rows | map(attribute=field) | reject('none') | max | default(0), 1] | max %}
{% set slot = 650 / (rows | length) %}
<section class="stats-chart-panel stats-series-{{ field }}">
  <h4>{{ label }}</h4>
  <svg class="stats-chart" viewBox="0 0 720 220" role="img" aria-labelledby="stats-chart-{{ field }}-title stats-chart-{{ field }}-desc">
    <title id="stats-chart-{{ field }}-title">{{ label }}</title>
    <desc id="stats-chart-{{ field }}-desc">{{ chart_description }}</desc>
    <path class="stats-chart-axis" d="M50 20V180H700" />
    <path class="stats-chart-grid" d="M50 30H700M50 105H700" />
    <text class="stats-chart-label" x="42" y="34" text-anchor="end">{{ maximum }}</text>
    <text class="stats-chart-label" x="42" y="184" text-anchor="end">0</text>
    {% set path = namespace(connected=false) %}
    <path class="stats-chart-line" d="{% for row in rows | reverse %}{% set unavailable = row[field] is none or (field == 'ports_targeted' and row.jobs_completed and row.jobs_without_target_count == row.jobs_completed) %}{% if unavailable %}{% set path.connected = false %}{% else %}{{ 'L' if path.connected else 'M' }}{{ 50 + (loop.index0 + 0.5) * slot }} {{ 180 - row[field] * 150 / maximum }} {% set path.connected = true %}{% endif %}{% endfor %}" />
    {% for row in rows | reverse %}
      {% set unavailable = row[field] is none or (field == "ports_targeted" and row.jobs_completed and row.jobs_without_target_count == row.jobs_completed) %}
      {% if not unavailable %}
      <circle class="stats-chart-point" cx="{{ 50 + (loop.index0 + 0.5) * slot }}" cy="{{ 180 - row[field] * 150 / maximum }}" r="2"><title>{{ row.sampled_at | default(row.label) }} UTC · {{ row[field] }}{% if (field == "ports_targeted" and row.jobs_without_target_count) or (field == "pending_documents" and row.unknown_reports) %} (known subtotal){% endif %}</title></circle>
      {% endif %}
    {% endfor %}
    <text class="stats-chart-label" x="50" y="208">{{ rows[-1].label }}</text>
    <text class="stats-chart-label" x="700" y="208" text-anchor="end">{{ rows[0].label }}</text>
  </svg>
</section>
{% endfor %}
</div>
